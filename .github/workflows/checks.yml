name: Checks

on:
    push:
        paths:
            - 'features/**'
            - 'internal/**'
            - 'package.json'
            - 'pnpm-workspace.yaml'
            - 'nx.json'
            - '.github/workflows/**'
            - '.github/actions/**'

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup
              uses: ./.github/actions/setup

            - name: Check packages
              run: pnpm lint
